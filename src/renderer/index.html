<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MPCS Testbench Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f4f9;
    }
    .tabs {
      overflow: hidden;
      border: 1px solid #ccc;
      background-color: #e9e9e9;
      border-radius: 8px 8px 0 0;
    }
    .tabs button {
      background-color: inherit;
      float: left;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 14px 16px;
      transition: 0.3s;
      font-size: 16px;
    }
    .tabs button:hover {
      background-color: #ddd;
    }
    .tabs button.active {
      background-color: white;
      border-bottom: 2px solid #007bff;
    }
    .tab-content {
      display: none;
      padding: 20px;
      border: 1px solid #ccc;
      border-top: none;
      background-color: white;
      border-radius: 0 0 8px 8px;
      margin-bottom: 20px;
    }
    .control-group {
      margin-bottom: 15px;
    }
    .control-label {
      font-weight: bold;
      display: inline-block;
      width: 100px;
    }
    .action-btn {
      padding: 8px 16px;
      margin-right: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Testbench Dashboard (Barebone)</h1>

  <div class="tabs">
    <button class="tablinks active" onclick="openTab(event, 'manual-dashboard')">Manual Dashboard</button>
    <button class="tablinks" onclick="openTab(event, 'sequence-dashboard')">Sequence Execution</button>
    <button class="tablinks" onclick="openTab(event, 'calibration-dashboard')">Calibration</button>
    <button class="tablinks" onclick="openTab(event, 'device-registry')">Device Registry</button>
  </div>
  
  <div class="tab-content" id="manual-dashboard" style="display: block;">
    <h2>Manual Dashboard</h2>
    <div id="controls-container">
      <!-- Controls will be injected here via JS -->
    </div>
    <button class="action-btn" id="btn-snapshot">Save Manual Snapshot</button>
  </div>

  <div class="tab-content" id="sequence-dashboard">
    <h2>Sequence Execution</h2>
    <button class="action-btn" id="btn-start-seq">Start Sequence 1</button>
    <button class="action-btn" id="btn-stop-seq">Stop Sequence</button>
    <p>Status: <span id="seq-status">Idle</span></p>
  </div>

  <div class="tab-content" id="calibration-dashboard">
    <h2>Calibration (Barebone)</h2>
    <button class="action-btn" id="btn-calibrate">Calibrate AO-05</button>
  </div>

  <div class="tab-content" id="device-registry">
    <h2>Device Registry</h2>
    <div style="margin-bottom: 20px; border: 1px solid #ccc; padding: 15px; border-radius: 5px;">
      <h3>Add / Update Device</h3>
      <input type="hidden" id="dev-id" />
      <div class="control-group">
        <label class="control-label">Display Name:</label>
        <input type="text" id="dev-name" placeholder="e.g. DAQ-01" />
      </div>
      <div class="control-group">
        <label class="control-label">IP Address:</label>
        <input type="text" id="dev-ip" placeholder="192.168.1.100" />
      </div>
      <div class="control-group">
        <label class="control-label">Port:</label>
        <input type="number" id="dev-port" placeholder="502" value="502" />
      </div>
      <button class="action-btn" id="btn-save-device">Save Device</button>
      <button class="action-btn" id="btn-clear-form">Clear Form</button>
    </div>

    <h3>Registered Devices</h3>
    <table border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>IP</th>
          <th>Port</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="device-list">
        <!-- Rows injected via JS -->
      </tbody>
    </table>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
